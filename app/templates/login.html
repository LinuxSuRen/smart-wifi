<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart WiFi Manager - Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;
  align-items:center;justify-content:center}
.login-box{background:#1e293b;border-radius:12px;padding:32px;width:360px;
  max-width:90vw;border:1px solid #334155}
.login-box h1{text-align:center;margin-bottom:8px;font-size:1.3rem;color:#f1f5f9}
.login-box p{text-align:center;color:#94a3b8;margin-bottom:24px;font-size:.85rem}
.form-group{margin-bottom:16px}
.form-group label{display:block;margin-bottom:4px;font-size:.8rem;color:#94a3b8}
.form-group input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid #475569;
  background:#0f172a;color:#e2e8f0;font-size:.9rem}
.form-group input:focus{outline:none;border-color:#3b82f6}
.btn{width:100%;padding:10px;border:none;border-radius:8px;cursor:pointer;
  font-size:.9rem;font-weight:600;transition:all .2s}
.btn-primary{background:#3b82f6;color:#fff}
.btn-primary:hover{background:#2563eb}
.btn:disabled{opacity:.5;cursor:not-allowed}
.error{color:#fca5a5;font-size:.85rem;text-align:center;margin-top:12px;display:none}
</style>
</head>
<body>
<div class="login-box">
  <h1>Smart WiFi Manager</h1>
  <p>Enter your Linux system credentials</p>
  <form id="loginForm" onsubmit="doLogin(event)">
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="loginUser" autofocus>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPass">
    </div>
    <button type="submit" class="btn btn-primary" id="loginBtn">Sign In</button>
    <div class="error" id="loginError"></div>
  </form>
</div>
<script>
async function doLogin(e) {
  e.preventDefault();
  var user = document.getElementById('loginUser').value.trim();
  var pass = document.getElementById('loginPass').value;
  var btn = document.getElementById('loginBtn');
  var err = document.getElementById('loginError');
  if (!user || !pass) { err.textContent = 'Please enter username and password'; err.style.display = 'block'; return; }
  btn.disabled = true;
  btn.textContent = 'Signing in...';
  err.style.display = 'none';
  try {
    var r = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: user, password: pass})
    });
    var data = await r.json();
    if (data.ok) {
      location.reload();
    } else {
      err.textContent = data.message;
      err.style.display = 'block';
    }
  } catch(e) {
    err.textContent = 'Login failed';
    err.style.display = 'block';
  }
  btn.disabled = false;
  btn.textContent = 'Sign In';
}
</script>
</body>
</html>
