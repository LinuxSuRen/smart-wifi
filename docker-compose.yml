services:
  smart-wifi:
    build: .
    container_name: smart-wifi
    network_mode: host
    privileged: true
    pid: host
    environment:
      - WIFI_INTERFACE=${WIFI_INTERFACE:-wlan0}
      - AP_SSID=${AP_SSID:-SmartWiFi-AP}
      - AP_PASSWORD=${AP_PASSWORD:-smartwifi123}
      - AP_CHANNEL=${AP_CHANNEL:-6}
      - AP_IP=${AP_IP:-192.168.4.1}
      - AP_NETMASK=${AP_NETMASK:-24}
      - WEB_HOST=0.0.0.0
      - WEB_PORT=${WEB_PORT:-8080}
    volumes:
      - /sys:/sys:ro
      - /proc:/proc:ro
      - /dev:/dev
      - /var/run/dbus:/var/run/dbus:ro
      - /run/dbus:/run/dbus:ro
      - ./app:/app/app:ro
    restart: unless-stopped

  # Alternative: non-privileged mode (WiFi mgmt limited)
  smart-wifi-safe:
    profiles: ["safe"]
    build: .
    container_name: smart-wifi-safe
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    environment:
      - WIFI_INTERFACE=${WIFI_INTERFACE:-wlan0}
      - WEB_HOST=0.0.0.0
      - WEB_PORT=${WEB_PORT:-8080}
    volumes:
      - /sys:/sys:ro
      - /proc:/proc:ro
      - /dev:/dev
      - /var/run/dbus:/var/run/dbus:ro
    restart: unless-stopped
